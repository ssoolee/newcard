<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover plus the safe-area padding in CSS keeps the tab bar
         clear of the iPhone home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7b5cff" />
    <meta
      name="description"
      content="명함을 촬영하면 연락처로 바로 저장하거나 공유할 수 있습니다. 명함 정보는 이 기기에만 저장됩니다."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="명함" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- iOS ignores an SVG here, so the home-screen icon has to be a PNG. -->
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews. Whoever is sent this address sees what the app does
         before opening it; the image is a drawing, never a real card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="명함 스캐너" />
    <meta property="og:title" content="사진 한 장이면 연락처가 됩니다" />
    <meta
      property="og:description"
      content="AI가 명함에서 이름 · 회사 · 전화 · 이메일을 읽어냅니다. 명함 정보는 내 휴대폰에만 저장됩니다."
    />
    <meta property="og:url" content="https://ypainewcard.web.app/" />
    <meta property="og:image" content="https://ypainewcard.web.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="명함을 비추며 글자를 읽어내는 그림" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="사진 한 장이면 연락처가 됩니다" />
    <meta
      name="twitter:description"
      content="AI가 명함에서 이름 · 회사 · 전화 · 이메일을 읽어냅니다. 명함 정보는 내 휴대폰에만 저장됩니다."
    />
    <meta name="twitter:image" content="https://ypainewcard.web.app/og.png" />

    <title>명함 스캐너</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
