  </g>

  <rect x="128" y="162" width="256" height="188" rx="26" fill="#ffffff" />

  <circle cx="186" cy="218" r="28" fill="url(#dot)" />
  <rect x="228" y="204" width="118" height="16" rx="8" fill="#4a3f6e" />
  <rect x="228" y="230" width="80" height="12" rx="6" fill="#b9abe8" />
  <rect x="156" y="276" width="200" height="13" rx="6.5" fill="#b9abe8" />
  <rect x="156" y="306" width="148" height="13" rx="6.5" fill="#b9abe8" />

  <!-- The scan line, held mid-sweep. -->
