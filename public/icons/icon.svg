      <stop offset="0" stop-color="#ff6fae" />
      <stop offset="1" stop-color="#7b5cff" />
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fc0" />
      <stop offset="1" stop-color="#7b5cff" />
